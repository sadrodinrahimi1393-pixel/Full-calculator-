name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install "cython<3"

      - name: Check project
        run: |
          echo "===== PROJECT ====="
          ls -lah calculator_android

          test -f calculator_android/main.py
          test -f calculator_android/buildozer.spec

          echo "Project is OK"

      - name: Clean old Android build
        run: |
          rm -rf ~/.buildozer
          rm -rf calculator_android/.buildozer
          rm -rf calculator_android/bin

          echo "Old Android build removed"

      - name: Build APK
        working-directory: calculator_android
        run: |
          yes | buildozer -v android debug

      - name: Find APK
        if: always()
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: calculator_android/bin/*.apk
          if-no-files-found: error
