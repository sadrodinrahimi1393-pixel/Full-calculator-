name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install "cython<3"

      - name: Find project
        run: |
          echo "===== REPOSITORY ====="
          find . -maxdepth 4 -type f | sort

          echo "===== SEARCH BUILDOZER ====="

          SPEC=$(find . -name "buildozer.spec" -type f | head -1)

          if [ -z "$SPEC" ]; then
            echo "ERROR: buildozer.spec NOT FOUND"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")

          echo "buildozer.spec found:"
          echo "$SPEC"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check project
        run: |
          echo "===== PROJECT ====="
          ls -lah "$PROJECT_DIR"

          test -f "$PROJECT_DIR/buildozer.spec"
          test -f "$PROJECT_DIR/main.py"

          echo "main.py found!"
          echo "buildozer.spec found!"

      - name: Clean Buildozer
        run: |
          rm -rf "$PROJECT_DIR/.buildozer"
          rm -rf "$PROJECT_DIR/bin"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          buildozer -v android debug

      - name: Find APK
        if: always()
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: |
            **/bin/*.apk
          if-no-files-found: error
