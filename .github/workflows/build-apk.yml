name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install "cython<3"

      - name: Check files
        run: |
          echo "===== FILES ====="
          ls -lah
          echo "================="

          test -f main.py
          test -f buildozer.spec

          echo "main.py OK"
          echo "buildozer.spec OK"

      - name: Build APK
        env:
          P4A_RELEASE_KEYSTORE: ""
        run: |
          buildozer -v android debug

      - name: Show APK
        if: always()
        run: |
          echo "===== APK ====="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
          if-no-files-found: error
